<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ferramentas Fácil - Ferramentas Online Grátis</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fc;
  color: #222;
}

header {
  background: linear-gradient(135deg, #123b8a, #2575fc);
  color: white;
  text-align: center;
  padding: 35px 15px;
}

header h1 {
  margin: 0 0 12px;
  font-size: 30px;
}

header p {
  font-size: 16px;
}

nav {
  background: #102c65;
  padding: 15px;
  text-align: center;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 8px;
  display: inline-block;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.intro {
  text-align: center;
  margin-bottom: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 12px #00000012;
  text-align: center;
}

.card h2 {
  color: #174ca0;
}

textarea, input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

textarea
